<!DOCTYPE html>
<html lang="en" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advent of Code 20XX</title>
    <link rel="stylesheet" href="oat-0.6.0/oat.min.css">
    <link rel="stylesheet" href="oat-utilities-extension.css">
    <link rel="stylesheet" href="oat-animate-1.2.1/oat-animate.min.css">
    <meta name="description" content="Advent of Code in JavaScript.">
    <script type="module" src="main.js" defer></script>
  </head>
  <body class="vstack items-center h-100">
    <header class="p-4 align-center">
      <h1>Advent of Code 20XX</h1>
    </header>
    <main class="my-auto p-4 vstack w-100 max-w-lg">
      <noscript>JavaScript needs to be enabled to run solutions.</noscript>
      <div id="error-messages" class="vstack gap-1"></div>
      <form id="form" class="card">
        <label data-field>
          Day
          <select id="day-select" aria-label="Select a day" aria-describedby="day-select-error" required>
            <option value="">Select a day</option>
            <option value="1"  disabled>1</option>
            <option value="2"  disabled>2</option>
            <option value="3"  disabled>3</option>
            <option value="4"  disabled>4</option>
            <option value="5"  disabled>5</option>
            <option value="6"  disabled>6</option>
            <option value="7"  disabled>7</option>
            <option value="8"  disabled>8</option>
            <option value="9"  disabled>9</option>
            <option value="10" disabled>10</option>
            <option value="11" disabled>11</option>
            <option value="12" disabled>12</option>
            <option value="13" disabled>13</option>
            <option value="14" disabled>14</option>
            <option value="15" disabled>15</option>
            <option value="16" disabled>16</option>
            <option value="17" disabled>17</option>
            <option value="18" disabled>18</option>
            <option value="19" disabled>19</option>
            <option value="20" disabled>20</option>
            <option value="21" disabled>21</option>
            <option value="22" disabled>22</option>
            <option value="23" disabled>23</option>
            <option value="24" disabled>24</option>
            <option value="25" disabled>25</option>
          </select>
          <small id="day-select-error" class="error" role="status">A day must be selected.</small>
        </label>
        <label data-field>
          Puzzle input file (optional)<br />
          <input type="file" id="file-input" accept="text/plain" placeholder="Pick a file..." />
        </label>
        <label data-field>
          Puzzle input
          <textarea id="puzzle-input" placeholder="Puzzle input..." aria-describedby="puzzle-input-error" required></textarea>
          <small id="puzzle-input-error" class="error" role="status">Puzzle input is required.</small>
        </label>
        <button type="button" id="process-btn">Process</button>
      </form>
      <div class="card">
        <label>
          Result
          <fieldset id="result-group" class="group" disabled>
            <input id="result-input" type="text" placeholder="Puzzle answer" aria-live="polite" readonly />
            <button id="copy-result-btn" type="button" class="outline">Copy</button>
          </fieldset>
        </label>
      </div>
    </main>
    <footer class="mt-auto p-4">
      <a class="text-xs text-light" href="https://github.com/msigurd/advent-of-code-js" target="_blank" rel="noopener noreferrer">
        Source code
      </a>
    </footer>
    <!-- TEMPLATES -->
    <template id="error-template">
      <div role="alert" data-variant="error" ot-animate="fade-up">
        <strong>Error!</strong> <span class="error-description"></span>
      </div>
    </template>
  </body>
</html>
